<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>QuizHub | Nuevo test</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">
</head>

<body>

<div class="container py-4">

    <!-- ========================= -->
    <!-- CABECERA -->
    <!-- ========================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="app-title">
                QuizHub
            </h1>

            <p class="text-muted mb-0">
                Crea un nuevo cuestionario.
            </p>

        </div>

        <a href="/tests"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Volver

        </a>

    </div>

    <!-- ========================= -->
    <!-- FORMULARIO -->
    <!-- ========================= -->

    <div class="card main-card">

        <div class="card-body">

            <h2 class="text-center mb-3">

                <i class="bi bi-plus-circle text-success me-2"></i>

                Nuevo test

            </h2>

            <p class="text-center text-muted mb-5">

                Completa la información para crear un nuevo test.

            </p>

            <form th:action="@{/tests/guardar}"
                  th:object="${test}"
                  method="post">

                <!-- Título -->

                <div class="mb-4">

                    <label class="form-label">

                        <i class="bi bi-type me-2"></i>

                        Título

                    </label>

                    <input
                            type="text"
                            th:field="*{titulo}"
                            class="form-control"
                            placeholder="Ej.: Introducción a Java">

                    <div
                            class="text-danger mt-2"
                            th:if="${#fields.hasErrors('titulo')}"
                            th:errors="*{titulo}">
                    </div>

                </div>

                <!-- Descripción -->

                <div class="mb-4">

                    <label class="form-label">

                        <i class="bi bi-card-text me-2"></i>

                        Descripción

                    </label>

                    <textarea
                            th:field="*{descripcion}"
                            class="form-control"
                            rows="3"
                            placeholder="Describe brevemente el contenido del test">
                    </textarea>

                    <div
                            class="text-danger mt-2"
                            th:if="${#fields.hasErrors('descripcion')}"
                            th:errors="*{descripcion}">
                    </div>

                </div>

                <!-- Autor -->

                <div class="mb-4">

                    <label class="form-label">

                        <i class="bi bi-person-circle me-2"></i>

                        Autor

                    </label>

                    <input
                            type="text"
                            th:field="*{autor}"
                            class="form-control"
                            placeholder="Nombre del autor">

                    <div
                            class="text-danger mt-2"
                            th:if="${#fields.hasErrors('autor')}"
                            th:errors="*{autor}">
                    </div>

                </div>

                <!-- Pregunta -->

                <div class="mb-4">

                    <label class="form-label">

                        <i class="bi bi-question-circle me-2"></i>

                        Pregunta

                    </label>

                    <textarea
                            th:field="*{pregunta}"
                            class="form-control"
                            rows="3"
                            placeholder="Escribe la pregunta del test">
                    </textarea>

                    <div
                            class="text-danger mt-2"
                            th:if="${#fields.hasErrors('pregunta')}"
                            th:errors="*{pregunta}">
                    </div>

                </div>

                <!-- Respuesta -->

                <div class="mb-5">

                    <label class="form-label">

                        <i class="bi bi-check-circle me-2"></i>

                        Respuesta correcta

                    </label>

                    <input
                            type="text"
                            th:field="*{respuestaCorrecta}"
                            class="form-control"
                            placeholder="Introduce la respuesta correcta">

                    <div
                            class="text-danger mt-2"
                            th:if="${#fields.hasErrors('respuestaCorrecta')}"
                            th:errors="*{respuestaCorrecta}">
                    </div>

                </div>

                <!-- Botones -->

                <div class="d-flex justify-content-between">

                    <a
                            href="/tests"
                            class="btn btn-outline-secondary">

                        <i class="bi bi-arrow-left me-2"></i>

                        Cancelar

                    </a>

                    <button
                            type="submit"
                            class="btn btn-success">

                        <i class="bi bi-floppy me-2"></i>

                        Guardar test

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="text-center mt-4 mb-3">

        <small>

            QuizHub · Proyecto desarrollado con Spring Boot

        </small>

    </footer>

</div>

</body>

</html>
