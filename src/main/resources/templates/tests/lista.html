<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>QuizHub | Explorar tests</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS propio -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>

<body>

<div class="container py-4">

    <!-- ==================== -->
    <!-- CABECERA -->
    <!-- ==================== -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="mb-1">
                QuizHub
            </h1>

            <p class="text-muted mb-0">
                Explora todos los cuestionarios disponibles.
            </p>

        </div>

        <div class="d-flex align-items-center gap-2">

            <a href="/"
               class="btn btn-outline-secondary">

                <i class="bi bi-house-door me-2"></i>

                Inicio

            </a>

            <!-- Usuario no autenticado -->
            <div sec:authorize="!isAuthenticated()">

                <a href="/login"
                   class="btn btn-primary">

                    <i class="bi bi-box-arrow-in-right me-2"></i>

                    Iniciar sesión

                </a>

            </div>

            <!-- Usuario autenticado -->
            <div sec:authorize="isAuthenticated()"
                 class="d-flex align-items-center">

                <span class="me-3">

                    <i class="bi bi-person-circle me-1"></i>

                    <strong sec:authentication="name"></strong>

                </span>

                <form th:action="@{/logout}"
                      method="post"
                      class="d-inline">

                    <button type="submit"
                            class="btn btn-outline-danger">

                        <i class="bi bi-box-arrow-right me-2"></i>

                        Cerrar sesión

                    </button>

                </form>

            </div>

        </div>

    </div>

    <!-- ==================== -->
    <!-- BUSCADOR -->
    <!-- ==================== -->

    <div class="card main-card mb-4">

        <div class="card-body">

            <form action="/tests/buscar"
                  method="get"
                  class="row g-3 align-items-center">

                <div class="col-md-9">

                    <div class="input-group">

                        <span class="input-group-text">

                            <i class="bi bi-search"></i>

                        </span>

                        <input
                                type="text"
                                name="titulo"
                                class="form-control"
                                placeholder="Buscar un test por título...">

                    </div>

                </div>

                <div class="col-md-3 d-grid">

                    <button
                            type="submit"
                            class="btn btn-primary">

                        <i class="bi bi-search me-2"></i>

                        Buscar

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ==================== -->
    <!-- NUEVO TEST -->
    <!-- ==================== -->

    <div class="mb-4"
         sec:authorize="isAuthenticated()">

        <a href="/tests/nuevo"
           class="btn btn-success">

            <i class="bi bi-plus-circle me-2"></i>

            Nuevo test

        </a>

    </div>

    <!-- ==================== -->
    <!-- SIN TESTS -->
    <!-- ==================== -->

    <div th:if="${tests.isEmpty()}">

        <div class="card main-card">

            <div class="card-body text-center">

                <i class="bi bi-inbox display-3 text-secondary"></i>

                <h3 class="mt-3">
                    Todavía no hay tests
                </h3>

                <p class="text-muted">

                    Crea el primer cuestionario para comenzar.

                </p>

            </div>

        </div>

    </div>

    <!-- ==================== -->
    <!-- LISTADO -->
    <!-- ==================== -->

    <div th:each="test : ${tests}">

        <div class="card main-card mb-4">

            <div class="card-body">

                <h3 class="mb-3">

                    <i class="bi bi-journal-text text-primary me-2"></i>

                    <span th:text="${test.titulo}"></span>

                </h3>

                <p
                        class="mb-3"
                        th:text="${test.descripcion}">
                </p>

                <p class="text-muted mb-4">

                    <i class="bi bi-person-fill me-2"></i>

                    <strong th:text="${test.autor}"></strong>

                </p>

                <div class="d-flex flex-wrap gap-2">

                    <!-- Realizar -->

                    <a
                            class="btn btn-success"

                            th:href="@{/tests/realizar/{id}(id=${test.id})}">

                        <i class="bi bi-play-fill me-2"></i>

                        Realizar

                    </a>

                    <!-- Editar -->

                    <a
                            sec:authorize="isAuthenticated()"

                            class="btn btn-primary"

                            th:href="@{/tests/editar/{id}(id=${test.id})}">

                        <i class="bi bi-pencil-square me-2"></i>

                        Editar

                    </a>

                    <!-- Eliminar -->

                    <a
                            sec:authorize="hasRole('ADMIN')"

                            class="btn btn-danger"

                            th:href="@{/tests/eliminar/{id}(id=${test.id})}"

                            onclick="return confirm('¿Eliminar este test?')">

                        <i class="bi bi-trash me-2"></i>

                        Eliminar

                    </a>

                </div>

            </div>

        </div>

    </div>

    <!-- ==================== -->
    <!-- FOOTER -->
    <!-- ==================== -->

    <footer class="text-center mt-4 mb-3">

        <small>

            QuizHub · Proyecto desarrollado con Spring Boot

        </small>

    </footer>

</div>

</body>
</html>
