<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>QuizHub | Realizar test</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<div class="container py-4">

    <!-- ========================= -->
    <!-- CABECERA -->
    <!-- ========================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="mb-1">
                QuizHub
            </h1>

            <p class="text-muted mb-0">
                Responde al cuestionario y comprueba tus conocimientos.
            </p>

        </div>

        <a href="/tests"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Volver

        </a>

    </div>

    <!-- ========================= -->
    <!-- TEST -->
    <!-- ========================= -->

    <div class="card main-card">

        <div class="card-body">

            <span class="badge bg-primary mb-3">
                TEST
            </span>

            <h2 class="mb-3"
                th:text="${test.titulo}">
            </h2>

            <p class="lead text-muted mb-4"
               th:text="${test.descripcion}">
            </p>

            <p class="test-author mb-4">

                <i class="bi bi-person-circle me-2"></i>

                <strong th:text="${test.autor}"></strong>

            </p>

            <hr>

            <h4 class="mt-4 mb-3">

                <i class="bi bi-question-circle me-2 text-primary"></i>

                Pregunta

            </h4>

            <div class="alert alert-light border">

                <p class="mb-0"
                   th:text="${test.pregunta}">
                </p>

            </div>

            <!-- ========================= -->
            <!-- RESPUESTA -->
            <!-- ========================= -->

            <form th:action="@{/tests/resultado}"
                  method="post">

                <input
                        type="hidden"
                        name="id"
                        th:value="${test.id}">

                <div class="mb-5">

                    <label class="form-label">

                        <i class="bi bi-pencil-square me-2"></i>

                        Tu respuesta

                    </label>

                    <input
                            type="text"
                            name="respuestaUsuario"
                            class="form-control"
                            placeholder="Escribe aquí tu respuesta..."
                            required>

                </div>

                <div class="d-flex justify-content-between">

                    <a href="/tests"
                       class="btn btn-outline-secondary">

                        <i class="bi bi-arrow-left me-2"></i>

                        Cancelar

                    </a>

                    <button
                            type="submit"
                            class="btn btn-success">

                        <i class="bi bi-check2-circle me-2"></i>

                        Finalizar test

                    </button>

                </div>

            </form>

        </div>

    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="text-center mt-4 mb-3">

        <small>

            QuizHub · Proyecto desarrollado con Spring Boot

        </small>

    </footer>

</div>

</body>
</html>
