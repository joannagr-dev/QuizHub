<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Realizar Test</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <!-- TITULO -->
                    <h1 class="mb-4 text-center"
                        th:text="${test.titulo}">
                    </h1>

                    <!-- DESCRIPCION -->
                    <p class="lead text-center"
                       th:text="${test.descripcion}">
                    </p>

                    <hr class="my-4">

                    <!-- AUTOR -->
                    <p class="text-muted text-center">

                        Creado por:
                        <strong th:text="${test.autor}"></strong>

                    </p>

                    <hr class="my-4">

                    <!-- PREGUNTA -->
                    <h4 class="mb-3">
                        Pregunta:
                    </h4>

                    <div class="alert alert-secondary">

                        <p class="mb-0"
                           th:text="${test.pregunta}">
                        </p>

                    </div>

                    <!-- FORMULARIO -->
                    <form th:action="@{/tests/resultado}"
                          method="post">

                        <!-- ID -->
                        <input type="hidden"
                               name="id"
                               th:value="${test.id}">

                        <!-- RESPUESTA -->
                        <div class="mb-4">

                            <label class="form-label">
                                Tu respuesta
                            </label>

                            <input type="text"
                                   name="respuestaUsuario"
                                   class="form-control"
                                   placeholder="Escribe tu respuesta"
                                   required>

                        </div>

                        <!-- BOTONES -->
                        <div class="d-flex justify-content-between">

                            <a href="/tests"
                               class="btn btn-secondary">
                                Volver
                            </a>

                            <button type="submit"
                                    class="btn btn-success">
                                Finalizar Test
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
