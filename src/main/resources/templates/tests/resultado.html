<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>QuizHub | Resultado</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link
            rel="stylesheet"
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- CSS -->
    <link
            rel="stylesheet"
            th:href="@{/css/style.css}">

</head>

<body>

<div class="container py-4">

    <!-- ========================= -->
    <!-- CABECERA -->
    <!-- ========================= -->

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>

            <h1 class="mb-1">
                QuizHub
            </h1>

            <p class="text-muted mb-0">
                Resultado del cuestionario.
            </p>

        </div>

        <a href="/tests"
           class="btn btn-outline-secondary">

            <i class="bi bi-arrow-left me-2"></i>

            Volver

        </a>

    </div>

    <!-- ========================= -->
    <!-- RESULTADO -->
    <!-- ========================= -->

    <div class="card main-card">

        <div class="card-body text-center">

            <span class="badge bg-primary mb-3">
                RESULTADO
            </span>

            <h2 class="mb-3"
                th:text="${test.titulo}">
            </h2>

            <hr class="my-4">

            <!-- RESPUESTA CORRECTA -->

            <div th:if="${correcta}">

                <i class="bi bi-check-circle-fill
                          text-success display-1">
                </i>

                <h2 class="text-success mt-3">

                    ¡Respuesta correcta!

                </h2>

                <p class="lead">

                    Has respondido correctamente.

                </p>

            </div>

            <!-- RESPUESTA INCORRECTA -->

            <div th:unless="${correcta}">

                <i class="bi bi-x-circle-fill
                          text-danger display-1">
                </i>

                <h2 class="text-danger mt-3">

                    Respuesta incorrecta

                </h2>

                <p>

                    Tu respuesta:

                    <strong
                            th:text="${respuestaUsuario}">
                    </strong>

                </p>

                <p>

                    Respuesta correcta:

                    <strong
                            th:text="${test.respuestaCorrecta}">
                    </strong>

                </p>

            </div>

            <hr class="my-5">

            <!-- PORCENTAJE -->

            <h4 class="text-muted">

                Puntuación obtenida

            </h4>

            <h1 class="display-2 fw-bold text-primary"
                th:text="${porcentaje + '%'}">
            </h1>

            <!-- BOTONES -->

            <div class="d-flex justify-content-center gap-3 mt-5">

                <a href="/tests"
                   class="btn btn-primary">

                    <i class="bi bi-journal-text me-2"></i>

                    Ver tests

                </a>

                <a th:href="@{/tests/realizar/{id}(id=${test.id})}"
                   class="btn btn-success">

                    <i class="bi bi-arrow-repeat me-2"></i>

                    Repetir

                </a>

            </div>

        </div>

    </div>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer class="text-center mt-4 mb-3">

        <small>

            QuizHub · Proyecto desarrollado con Spring Boot

        </small>

    </footer>

</div>

</body>

</html>
