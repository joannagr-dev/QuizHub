<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Resultado del Test</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card shadow border-0 text-center">

                <div class="card-body p-5">

                    <!-- TITULO -->
                    <h1 class="mb-4">
                        Resultado del Test
                    </h1>

                    <h3 class="mb-3"
                        th:text="${test.titulo}">
                    </h3>

                    <hr class="my-4">

                    <!-- RESPUESTA CORRECTA -->
                    <div th:if="${correcta}">

                        <div class="alert alert-success">

                            <h2>
                                ¡Respuesta correcta!
                            </h2>

                            <p class="mb-0">
                                Has respondido correctamente.
                            </p>

                        </div>

                    </div>

                    <!-- RESPUESTA INCORRECTA -->
                    <div th:unless="${correcta}">

                        <div class="alert alert-danger">

                            <h2>
                                Respuesta incorrecta
                            </h2>

                            <p>
                                Tu respuesta:
                                <strong th:text="${respuestaUsuario}"></strong>
                            </p>

                            <p class="mb-0">
                                Respuesta correcta:
                                <strong th:text="${test.respuestaCorrecta}"></strong>
                            </p>

                        </div>

                    </div>

                    <hr class="my-4">

                    <!-- PORCENTAJE -->
                    <h4 class="mb-3">
                        Porcentaje obtenido
                    </h4>

                    <h1 class="display-3"
                        th:text="${porcentaje + '%'}">
                    </h1>

                    <!-- BOTONES -->
                    <div class="d-flex justify-content-center gap-3 mt-4">

                        <a href="/tests"
                           class="btn btn-primary">
                            Volver a Tests
                        </a>

                        <a th:href="@{/tests/realizar/{id}(id=${test.id})}"
                           class="btn btn-success">
                            Repetir Test
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
