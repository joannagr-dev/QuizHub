<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Editar Test</title>

    <!-- Bootstrap -->
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">
</head>

<body class="bg-light">

<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-md-7">

            <div class="card shadow border-0">

                <div class="card-body p-5">

                    <!-- TITULO -->
                    <h1 class="mb-4 text-center">
                        Editar Test
                    </h1>

                    <p class="text-center text-muted mb-4">
                        Modifica la información del test seleccionado.
                    </p>

                    <!-- FORMULARIO -->
                    <form th:action="@{/tests/actualizar}"
                          th:object="${test}"
                          method="post">

                        <!-- ID oculto -->
                        <input type="hidden"
                               th:field="*{id}">

                        <!-- TITULO -->
                        <div class="mb-4">

                            <label class="form-label">
                                Título
                            </label>

                            <input type="text"
                                   th:field="*{titulo}"
                                   class="form-control"
                                   placeholder="Título del test">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('titulo')}"
                                 th:errors="*{titulo}">
                            </div>

                        </div>

                        <!-- DESCRIPCION -->
                        <div class="mb-4">

                            <label class="form-label">
                                Descripción
                            </label>

                            <textarea th:field="*{descripcion}"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Descripción del test">
                            </textarea>

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('descripcion')}"
                                 th:errors="*{descripcion}">
                            </div>

                        </div>

                        <!-- AUTOR -->
                        <div class="mb-4">

                            <label class="form-label">
                                Autor
                            </label>

                            <input type="text"
                                   th:field="*{autor}"
                                   class="form-control"
                                   placeholder="Autor del test">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('autor')}"
                                 th:errors="*{autor}">
                            </div>

                        </div>

                        <!-- PREGUNTA -->
                        <div class="mb-4">

                            <label class="form-label">
                                Pregunta
                            </label>

                            <textarea th:field="*{pregunta}"
                                      class="form-control"
                                      rows="3"
                                      placeholder="Pregunta del test">
                            </textarea>

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('pregunta')}"
                                 th:errors="*{pregunta}">
                            </div>

                        </div>

                        <!-- RESPUESTA CORRECTA -->
                        <div class="mb-4">

                            <label class="form-label">
                                Respuesta correcta
                            </label>

                            <input type="text"
                                   th:field="*{respuestaCorrecta}"
                                   class="form-control"
                                   placeholder="Respuesta correcta">

                            <div class="text-danger mt-1"
                                 th:if="${#fields.hasErrors('respuestaCorrecta')}"
                                 th:errors="*{respuestaCorrecta}">
                            </div>

                        </div>

                        <!-- BOTONES -->
                        <div class="d-flex justify-content-between">

                            <a href="/tests"
                               class="btn btn-secondary">
                                Volver
                            </a>

                            <button type="submit"
                                    class="btn btn-primary">
                                Actualizar Test
                            </button>

                        </div>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
